[project]
name = "margai"
version = "0.1.0"
description = "Portable LLM wrapper framework: configurable interceptors around any upstream provider."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "httpx>=0.27.0",
    "uvicorn>=0.53.0",
]

[project.scripts]
margai = "margai.__main__:run"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/margai"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]